<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sealed System</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Yuji+Syuku&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-texture"></div>
    <div class="torii-container"></div>
    
    <div class="scroll-container">
        <header class="scroll-header">
            <h1>The Sealed Ledger</h1>
            <div class="seal-icon"></div>
        </header>

        <div id="chat-history" class="chat-history">
            <!-- Messages will appear here -->
            <div class="message system-message">
                The seal has not yielded. State your purpose, traveler.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Speak to the seal..." autocomplete="off">
            <button id="send-button">Speak</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
